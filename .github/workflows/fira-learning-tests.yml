name: FIRA from-scratch learning tests

on:
  push:
    branches:
      - feat/fira-from-scratch-learning-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-learning-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt pytest
      - name: Run engine tests
        working-directory: engine
        env:
          PYTHONPATH: .
        run: pytest -q

  flutter-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter application
        run: flutter analyze --no-fatal-infos

  android-release:
    runs-on: ubuntu-latest
    needs: [python-learning-engine, flutter-analysis]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: FIRA-Android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
