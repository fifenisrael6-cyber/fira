name: FIRA from-scratch learning tests

on:
  push:
    branches:
      - feat/fira-from-scratch-learning-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-learning-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r engine/requirements.txt pytest
      - name: Run engine tests
        working-directory: engine
        env:
          PYTHONPATH: .
        run: pytest -q
